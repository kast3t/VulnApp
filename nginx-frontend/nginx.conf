server {
	listen 80;
	server_name _;
	
	default_type text/plain;
	return 418 "418 I'm a teapot\n";
}

# Встроенный DNS Docker: имена контейнеров резолвятся при каждом запросе, а не один раз при старте nginx,
# иначе после пересоздания backend/pgadmin (новый IP) nginx отдаёт 502
resolver 127.0.0.11 valid=10s ipv6=off;

server {
	listen 80;
	server_name vulnapp.local;

	location / {
		root   /usr/share/nginx/html;
		index  index.html;
		try_files $uri /index.html;
	}

	location /api/ {
		set $backend_upstream http://backend:5000;
		proxy_pass $backend_upstream;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_redirect off;
	}
}

server {
	listen 80;
	server_name 172.172.0.52;

	location / {
		set $pgadmin_upstream http://pgadmin:5555;
		proxy_pass $pgadmin_upstream;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_redirect off;
	}
}
